spring:
  application:
    name: gateway

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/gateway
    username: gateway
    password: gateway
    hikari:
      connection-init-sql: SET search_path TO gateway

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: gateway
    schemas: gateway
    baseline-on-migrate: true


server:
  port: 8080

rules-engine:
  uri: ${RULES_ENGINE_URI:http://localhost:8081}

logging:
  level:
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: DEBUG
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: DEBUG

secret:
  key: "ZDY0NTI1YmMwZjA3MTQ5NzgyNzBmNjI0ZDYwNjc3MjA5NjNkZWIwN2FhYjQ1"
